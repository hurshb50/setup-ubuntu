name: Publish

on:
    workflow_dispatch:
        inputs:
            bump:
                description: Version Bump
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major

concurrency:
    group: publish
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    code-checks:
        runs-on: ubuntu-slim
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.20.0
              with:
                  cache: true

            - name: Install Dependencies
              run: vp install

            - name: Code Checks
              run: vp check

    unit-tests:
        runs-on: ubuntu-slim
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.20.0
              with:
                  cache: true

            - name: Install Dependencies
              run: vp install

            - name: Unit Tests
              run: vp test --project unit

    build:
        runs-on: ubuntu-slim
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.20.0
              with:
                  cache: true

            - name: Install Dependencies
              run: vp install

            - name: Build Application
              run: vp run build

    integration-tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.20.0
              with:
                  cache: true

            - name: Install Dependencies
              run: vp install

            - name: Integration Tests
              run: vp run integration-test

    end-to-end-tests:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.20.0
              with:
                  cache: true

            - name: Install Dependencies
              run: vp install

            - name: End-to-End Tests
              run: vp run end-to-end-test

    publish:
        needs:
            - code-checks
            - build
            - unit-tests
            - integration-tests
            - end-to-end-tests
        runs-on: ubuntu-slim
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.20.0
              with:
                  cache: true

            - name: Install Dependencies
              run: vp install

            - name: Build Application
              run: vp run build

            - name: Bump Version
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  vp pm version "${{ inputs.bump }}"
                  git push origin HEAD
                  git push origin "v$(node -p "require('./package.json').version")"

            - name: Publish to npm
              run: vp pm stage publish
